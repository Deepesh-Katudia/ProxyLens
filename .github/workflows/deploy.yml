name: Deploy

# A version tag deploys to Cloud Run. One-time setup: deploy/setup.sh, then
# deploy/setup_github.sh, which prints the four repository variables used below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `git describe` tags the images
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: deploy/deploy.sh
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}

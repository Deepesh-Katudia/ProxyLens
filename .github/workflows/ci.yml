name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests scripts eval
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proxylens-api .
      - name: Student image variant loads llama.cpp (Cloud Run build, minus the model)
        run: |
          DOCKER_BUILDKIT=1 docker build --build-arg INSTALL_STUDENT=1 -t proxylens-api-student .
          docker run --rm proxylens-api-student python -c "import llama_cpp; print('llama.cpp', llama_cpp.__version__)"
      - name: Deploy scripts parse
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - run: docker build -t proxylens-frontend ./frontend
      - name: Smoke test compose stack
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent http://localhost:8000/healthz
          curl --fail --silent http://localhost:5173/api/v1/healthz
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

[project]
name = "proxylens"
version = "0.1.0"
description = "AI proxy-voting analyst for Indian AGM/EGM resolutions"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymongo>=4.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "langgraph>=0.2",
]

[project.optional-dependencies]
# Local GGUF inference for the fine-tuned student (llama.cpp). Optional so CI
# and the API image can be built without a C++ toolchain.
student = ["llama-cpp-python>=0.3.2"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mongomock-motor>=0.0.34",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

# CPU-only PyTorch keeps the API image small; GPU work happens in Colab notebooks.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
llama-cpp-python = [{ index = "llama-cpp-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Prebuilt CPU wheels published by the llama-cpp-python project.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Cell sources for the Colab notebooks: long lines are notebook code, not repo code.
"scripts/build_notebooks.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["frontend/", "notebooks/"]

[[tool.mypy.overrides]]
# llama_cpp comes from the optional `student` extra, which CI does not install.
module = ["mongomock_motor.*", "llama_cpp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
